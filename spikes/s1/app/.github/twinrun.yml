app:
  id: io.github.kaulith.helpdeskanalytics
build:
  command: ./gradlew :app:assembleDebug
  apk: app/build/outputs/apk/debug/app-debug.apk
backend:
  hosts:
    - dev.localhost
signIn: .github/twinrun/flows/sign_in.yaml
screens:
  - id: ticket_detail
    deepLink: helpdesk://ticket/0253
    identity:
      text: Ticket ID
  - id: ticket_detail_from_list
    flow: .github/twinrun/flows/ticket_detail.yaml
    identity:
      text: Ticket ID
