name: comment probe

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request to comment on
        required: true
        type: number

permissions: {}

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx twinrun comment --out test/fixtures/run --repo "$GITHUB_REPOSITORY" --pr "$PR"
        env:
          PR: ${{ inputs.pr }}
          GITHUB_TOKEN: ${{ github.token }}
